name: pokemon-card-pregrader

services:
  backend:
    image: pokemon-card-pregrader-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      API_TIMEOUT_SECONDS: ${API_TIMEOUT_SECONDS:-45}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
    expose:
      - "8000"

  frontend:
    image: pokemon-card-pregrader-frontend:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_started
