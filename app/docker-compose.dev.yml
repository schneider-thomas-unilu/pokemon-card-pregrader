services:
  frontend:
    image: pokemon-card-pregrader-frontend-dev:local
    build:
      context: ..
      dockerfile: app/frontend/Dockerfile.dev
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    ports: !override
      - "${DEV_APP_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_HMR_CLIENT_PORT: ${DEV_APP_PORT:-5173}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  frontend_node_modules:
