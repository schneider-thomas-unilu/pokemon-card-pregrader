services:
  frontend:
    image: pokemon-card-pregrader-frontend-dev:local
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    ports: !override
      - "${DEV_APP_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_HMR_CLIENT_PORT: ${DEV_APP_PORT:-5173}
      API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend

volumes:
  frontend_node_modules:
